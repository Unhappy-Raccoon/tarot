name: Deploy WebApp to GitHub Pages

on:
  push:
    branches:
      - feat/supabase-edge-runtime
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Pages (only from main)"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      artifact: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build WebApp for GitHub Pages
        env:
          VITE_BASE_PATH: /tarot/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build --workspace=@pcj/web
      - name: Validate published API URL
        if: github.event_name == 'workflow_dispatch' && inputs.publish == 'yes'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [[ ! "$VITE_API_URL" =~ ^https://[a-z0-9-]+\.supabase\.co/functions/v1/api$ ]]; then
            echo "Repository variable VITE_API_URL must be the Supabase Edge Function API URL."
            exit 1
          fi
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'yes' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
