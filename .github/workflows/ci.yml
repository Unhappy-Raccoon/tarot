name: CI

on:
  push:
    branches:
      - feat/telegram-webapp-foundation
      - feat/natal-chart-engine
      - feat/ai-astrologer
      - feat/daily-horoscope
      - feat/mvp-test-readiness
      - feat/supabase-edge-runtime
  pull_request:
    branches:
      - main
      - feat/telegram-webapp-foundation
      - feat/natal-chart-engine
      - feat/ai-astrologer
      - feat/daily-horoscope
      - feat/mvp-test-readiness
      - feat/supabase-edge-runtime

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Run server unit tests
        run: npm run test:server
      - name: Build workspaces
        run: npm run build
      - name: Stage server modules for Edge bundling
        run: node scripts/prepare-supabase-functions.mjs
      - name: Setup Deno
        uses: denoland/setup-deno@v2
      - name: Type-check Supabase Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/api/index.ts supabase/functions/telegram-webhook/index.ts supabase/functions/process-horoscope-notifications/index.ts
      - name: Test Supabase Edge security helpers
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/security.test.ts supabase/functions/api/path.test.ts
      - name: Build production API container
        run: docker build -f apps/server/Dockerfile -t pcj-api:ci .
      - name: Validate test deployment Compose file
        run: |
          cp .env.test.example .env.test
          docker compose --env-file .env.test -f docker-compose.test.yml config --quiet
