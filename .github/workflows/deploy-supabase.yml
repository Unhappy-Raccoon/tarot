name: Deploy Supabase test environment

on:
  # workflow_dispatch is only available in GitHub UI after this workflow exists
  # on the default branch. The feature-branch push trigger below enables the initial
  # read-only validation without merging the deployment workflow into main.
  push:
    branches:
      - feat/supabase-edge-runtime
    paths:
      - ".github/workflows/deploy-supabase.yml"
      - ".github/deploy-requests/apply-migrations.txt"
      - ".github/deploy-requests/deploy-functions.txt"
  workflow_dispatch:
    inputs:
      stage:
        description: Select a deployment stage
        required: true
        type: choice
        default: validate
        options:
          - validate
          - apply-migrations
          - deploy-functions
      confirmation:
        description: For apply-migrations or deploy-functions, type DEPLOY_TO_TEST
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-test-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/feat/supabase-edge-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout approved test branch
        uses: actions/checkout@v4
      - name: Select deployment stage
        id: stage
        shell: bash
        env:
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          stage="${INPUT_STAGE:-validate}"
          confirmation="${INPUT_CONFIRMATION:-}"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            commit_message="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")"
            changed_files="$(jq -r '[.head_commit.added[]?, .head_commit.modified[]?] | .[]' "$GITHUB_EVENT_PATH")"
            request_file=""
            if [[ "$commit_message" == *"[apply-migrations]"* ]] || grep -Fxq ".github/deploy-requests/apply-migrations.txt" <<< "$changed_files"; then
              stage="apply-migrations"
              request_file=".github/deploy-requests/apply-migrations.txt"
            elif [[ "$commit_message" == *"[deploy-functions]"* ]] || grep -Fxq ".github/deploy-requests/deploy-functions.txt" <<< "$changed_files"; then
              stage="deploy-functions"
              request_file=".github/deploy-requests/deploy-functions.txt"
            else
              stage="validate"
            fi
            if [[ -n "$request_file" ]]; then
              if [[ ! -f "$request_file" ]] || [[ "$(tr -d '\r\n' < "$request_file")" != "DEPLOY_TO_TEST" ]]; then
                echo "Deployment request file must contain exactly DEPLOY_TO_TEST."
                exit 1
              fi
              confirmation="DEPLOY_TO_TEST"
            fi
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "confirmation=$confirmation" >> "$GITHUB_OUTPUT"
      - name: Validate target and credentials
        shell: bash
        env:
          DEPLOY_STAGE: ${{ steps.stage.outputs.stage }}
          DEPLOY_CONFIRMATION: ${{ steps.stage.outputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$SUPABASE_PROJECT_ID" != "uayoqicecdtcxouwsprh" ]]; then
            echo "SUPABASE_PROJECT_ID is missing or does not match the approved test project."
            exit 1
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD under repository Actions Secrets."
            exit 1
          fi
          if [[ "$DEPLOY_STAGE" != "validate" && "$DEPLOY_CONFIRMATION" != "DEPLOY_TO_TEST" ]]; then
            echo "A mutating stage requires the exact confirmation: DEPLOY_TO_TEST"
            exit 1
          fi
          echo "Target project ref: $SUPABASE_PROJECT_ID"
          echo "Selected stage: $DEPLOY_STAGE"
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Link the test project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Show pending migrations (dry run)
        if: steps.stage.outputs.stage == 'validate' || steps.stage.outputs.stage == 'apply-migrations'
        run: supabase db push --dry-run --linked
      - name: Apply database migrations
        if: steps.stage.outputs.stage == 'apply-migrations'
        run: supabase db push --yes --linked
      - name: Setup Node.js
        if: steps.stage.outputs.stage == 'deploy-functions'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install workspace dependencies
        if: steps.stage.outputs.stage == 'deploy-functions'
        run: npm install --no-audit --no-fund
      - name: Build application workspaces
        if: steps.stage.outputs.stage == 'deploy-functions'
        run: npm run build
      - name: Stage server modules for Edge Functions
        if: steps.stage.outputs.stage == 'deploy-functions'
        run: node scripts/prepare-supabase-functions.mjs
      - name: Type-check Edge Functions
        if: steps.stage.outputs.stage == 'deploy-functions'
        uses: denoland/setup-deno@v2
      - name: Run Deno type checks
        if: steps.stage.outputs.stage == 'deploy-functions'
        run: deno check --config supabase/functions/deno.json supabase/functions/api/index.ts supabase/functions/telegram-webhook/index.ts supabase/functions/process-horoscope-notifications/index.ts
      - name: Configure PostgreSQL Session Pooler secret
        if: steps.stage.outputs.stage == 'deploy-functions'
        shell: bash
        run: |
          set -euo pipefail
          env_file="${RUNNER_TEMP}/supabase-edge-secrets.env"
          trap 'rm -f "$env_file"' EXIT
          python3 - "$env_file" <<'PY'
          import os
          import sys
          from urllib.parse import quote

          project_id = os.environ["SUPABASE_PROJECT_ID"]
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          database_url = (
              f"postgresql://postgres.{project_id}:{password}"
              "@aws-0-eu-north-1.pooler.supabase.com:5432/postgres?sslmode=require"
          )
          path = sys.argv[1]
          with open(path, "w", encoding="utf-8") as secret_file:
              secret_file.write(f"DATABASE_URL={database_url}\n")
          os.chmod(path, 0o600)
          PY
          supabase secrets set --env-file "$env_file" --project-ref "$SUPABASE_PROJECT_ID"
          echo "Configured DATABASE_URL with the Session Pooler connection."
      - name: Configure Supabase Cron and Vault secrets
        if: steps.stage.outputs.stage == 'deploy-functions'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

          cron_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$cron_secret"
          secret_file="${RUNNER_TEMP}/horoscope-cron-secret.env"
          trap 'rm -f "$secret_file"; unset cron_secret PGPASSWORD' EXIT
          printf 'HOROSCOPE_CRON_SECRET=%s\n' "$cron_secret" > "$secret_file"
          chmod 600 "$secret_file"
          supabase secrets set --env-file "$secret_file" --project-ref "$SUPABASE_PROJECT_ID"

          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          export PGSSLMODE=require
          psql \
            --host aws-0-eu-north-1.pooler.supabase.com \
            --port 5432 \
            --username "postgres.$SUPABASE_PROJECT_ID" \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --set "project_url=https://$SUPABASE_PROJECT_ID.supabase.co" \
            --set "cron_secret=$cron_secret" \
            --no-psqlrc \
            --quiet \
            --tuples-only \
            --no-align <<'SQL'
          CREATE SCHEMA IF NOT EXISTS extensions;
          DO $extensions$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'pg_cron') THEN
              EXECUTE 'CREATE EXTENSION pg_cron WITH SCHEMA pg_catalog';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'pg_net') THEN
              EXECUTE 'CREATE EXTENSION pg_net WITH SCHEMA extensions';
            END IF;
          END
          $extensions$;

          SELECT vault.create_secret(:'project_url', 'pcj_project_url', 'Supabase project URL for scheduled horoscope worker')
          WHERE NOT EXISTS (
            SELECT 1 FROM vault.secrets WHERE name = 'pcj_project_url'
          );
          SELECT vault.update_secret(id, :'project_url', 'pcj_project_url', 'Supabase project URL for scheduled horoscope worker')
          FROM vault.secrets
          WHERE name = 'pcj_project_url';

          SELECT vault.create_secret(:'cron_secret', 'pcj_horoscope_cron_secret', 'Shared secret for scheduled horoscope worker')
          WHERE NOT EXISTS (
            SELECT 1 FROM vault.secrets WHERE name = 'pcj_horoscope_cron_secret'
          );
          SELECT vault.update_secret(id, :'cron_secret', 'pcj_horoscope_cron_secret', 'Shared secret for scheduled horoscope worker')
          FROM vault.secrets
          WHERE name = 'pcj_horoscope_cron_secret';

          SELECT cron.unschedule(jobid)
          FROM cron.job
          WHERE jobname = 'pcj-horoscope-notifications';

          SELECT cron.schedule(
            'pcj-horoscope-notifications',
            '* * * * *',
            $job$
              SELECT net.http_post(
                url := (
                  SELECT decrypted_secret
                  FROM vault.decrypted_secrets
                  WHERE name = 'pcj_project_url'
                ) || '/functions/v1/process-horoscope-notifications',
                headers := jsonb_build_object(
                  'Content-Type', 'application/json',
                  'x-cron-secret', (
                    SELECT decrypted_secret
                    FROM vault.decrypted_secrets
                    WHERE name = 'pcj_horoscope_cron_secret'
                  )
                ),
                body := '{}'::jsonb,
                timeout_milliseconds := 10000
              ) AS request_id;
            $job$
          );
          SQL
          unset PGPASSWORD cron_secret
          echo "Supabase Cron job and Vault secrets configured."

      - name: Deploy API Edge Function
        if: steps.stage.outputs.stage == 'deploy-functions'
        run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Deploy Telegram Webhook Edge Function
        if: steps.stage.outputs.stage == 'deploy-functions'
        run: supabase functions deploy telegram-webhook --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
      - name: Deploy horoscope Cron worker Edge Function
        if: steps.stage.outputs.stage == 'deploy-functions'
        run: supabase functions deploy process-horoscope-notifications --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
