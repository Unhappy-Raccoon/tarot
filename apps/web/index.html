<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0A12" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Personal Cosmic Journal — персональный астрологический журнал." />
    <title>Personal Cosmic Journal</title>
    <style>
      :root { color-scheme: dark; background: #0B0A12; color: #F6E8DA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-width: 320px; min-height: 100%; margin: 0; background: #0B0A12; }
      body { min-height: 100vh; min-height: 100dvh; }
      #root { min-height: 100vh; min-height: 100dvh; }
      .pcj-boot-screen { display: grid; place-content: center; justify-items: center; gap: 14px; min-height: 100vh; min-height: 100dvh; padding: 32px 24px; text-align: center; background: radial-gradient(ellipse at 50% 20%, #261b3b 0%, #0B0A12 58%); }
      .pcj-boot-moon { color: #D9B98F; font: 52px Georgia, serif; text-shadow: 0 0 36px #6D5AE655; }
      .pcj-boot-title { margin: 0; color: #F6E8DA; font: 24px Georgia, serif; letter-spacing: .02em; }
      .pcj-boot-caption { margin: 0; color: #B9A6FF; font-size: 12px; letter-spacing: .18em; }
      .pcj-boot-line { width: 84px; height: 2px; margin-top: 12px; border-radius: 99px; background: linear-gradient(90deg, transparent, #D9B98F, transparent); animation: pcj-pulse 1.5s ease-in-out infinite; }
      .pcj-boot-error { display: grid; justify-items: center; gap: 12px; max-width: 360px; padding: 28px; }
      .pcj-boot-error p { color: #D6C7D9; line-height: 1.6; }
      .pcj-boot-error button { min-height: 44px; padding: 0 22px; border: 1px solid #D9B98F; border-radius: 999px; background: #D9B98F; color: #201729; font: inherit; }
      @keyframes pcj-pulse { 0%, 100% { opacity: .35; transform: scaleX(.78); } 50% { opacity: 1; transform: scaleX(1); } }
    </style>
    <script>
      (function () {
        function showBootError(message) {
          var root = document.getElementById("root");
          if (!root || root.dataset.pcjReactStarted === "true") return;
          root.innerHTML = '<main class="pcj-boot-screen"><div class="pcj-boot-error"><div class="pcj-boot-moon">☾</div><h1 class="pcj-boot-title">Не удалось открыть приложение</h1><p>' + message + '</p><button type="button" onclick="window.location.reload()">Перезагрузить</button></div></main>';
        }
        window.addEventListener("error", function (event) {
          if (event.target && event.target.tagName === "SCRIPT") {
            showBootError("Не удалось загрузить модуль интерфейса. Проверь подключение к интернету и попробуй ещё раз.");
          }
        }, true);
        window.addEventListener("unhandledrejection", function () {
          showBootError("Приложение столкнулось с ошибкой при запуске. Перезагрузи страницу.");
        });
        window.__pcjTelegramReady = new Promise(function (resolve) {
          if (window.Telegram && window.Telegram.WebApp) {
            resolve(true);
            return;
          }
          var settled = false;
          var finish = function (ready) {
            if (settled) return;
            settled = true;
            window.clearTimeout(timer);
            resolve(ready);
          };
          var timer = window.setTimeout(function () {
            finish(Boolean(window.Telegram && window.Telegram.WebApp));
          }, 8000);
          var script = document.createElement("script");
          script.src = "https://telegram.org/js/telegram-web-app.js?64";
          script.async = true;
          script.onload = function () { finish(Boolean(window.Telegram && window.Telegram.WebApp)); };
          script.onerror = function () { finish(false); };
          document.head.appendChild(script);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main class="pcj-boot-screen" aria-label="Загрузка Personal Cosmic Journal">
        <div class="pcj-boot-moon" aria-hidden="true">☾</div>
        <h1 class="pcj-boot-title">Personal Cosmic Journal</h1>
        <p class="pcj-boot-caption">ТАРО · АСТРОЛОГИЯ · ГАРМОНИЯ</p>
        <span class="pcj-boot-line" aria-hidden="true"></span>
      </main>
    </div>
    <noscript><p style="padding:24px;color:#F6E8DA">Для работы Personal Cosmic Journal необходимо включить JavaScript.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
